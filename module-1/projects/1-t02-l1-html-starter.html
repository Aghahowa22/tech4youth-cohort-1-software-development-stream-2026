==============================================
LESSON OBJECTIVES - Complete all TODOs above
==============================================

By completing this file, you will:

✓ Use semantic HTML landmark elements (header, nav, main, aside, footer)
✓ Create a proper heading hierarchy (h1 → h2 → h3)
✓ Write accessible links with meaningful link text
✓ Add images with descriptive alt text
✓ Use unordered lists for grouping related items
✓ Structure content in sections and articles
✓ Understand why semantic elements matter for screen readers

==============================================
HINTS
==============================================

1. Header: Wrap your site title/logo here. Use a nav element inside or after it.

2. Nav: Use the <nav> element for navigation. Link structure:
   <nav>
       <a href="#home">Home</a>
       <a href="#about">About</a>
       ...
   </nav>

3. Main: Only one per page! Contains the primary content.

4. Section: Groups related content. Each section should have a heading.

5. Article: Self-contained content (like a blog post). Include:
   - h2 heading (not h1 — h1 is for the page title only)
   - paragraphs
   - an image with alt text.

6. Image syntax:
   <img src="image.jpg" alt="Description of what's in the image">

7. Unordered List:
   <ul>
       <li>Item 1</li>
       <li>Item 2</li>
   </ul>

8. Aside: Extra content like a sidebar. Use h3 headings inside.

9. Footer: Links, copyright, etc. Similar structure to header.

==============================================
ACCESSIBILITY CHECKLIST
==============================================

Before you finish, check:

□ One h1, and only one (the page title)
□ All headings in order (no skipping: h1 → h2 → h3)
□ All links have meaningful text (not "Click here")
□ All images have alt text
□ Semantic elements used (not all divs)
□ Forms not included in this lesson (that's L1 bonus!)
□ Page structure makes sense when read top-to-bottom
